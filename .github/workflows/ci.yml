name: ci
# This repo's own checks. The reusable workflows are exercised by their consumers;
# here we lint them and test the invariants a consumer cannot see.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image bundles shellcheck, so `run:` scripts are linted too.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: node --test '.github/**/*.test.mjs' 'test/*.test.mjs'

  all-checks:
    needs: [actionlint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: test "$RESULTS" = 'success success'
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
