name: Feature request
description: Suggest a new capability or a change to an existing one
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind. Leave it empty if you only want to describe the problem.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
