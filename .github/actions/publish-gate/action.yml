name: Publish gate
description: Block a release whose tarball ships files it must not, or adds an unexpected runtime dependency
# Inspects what a release is about to publish against what is already on the
# registry. It packs the working tree, so the caller must have installed and built
# the workspace first.
#
# It runs on the release, not on the changesets "Version Packages" PR. A PR opened
# with the built-in GITHUB_TOKEN triggers no `on: pull_request` workflows, so a gate
# attached to it never runs. cyberuni/.github learned this after its gate had never
# once executed there.
#
# Blocks on:
#   - files that must never ship (tests, key material, env files, repo metadata)
#   - new runtime `dependencies` not in the published version, unless allowed
# Reports without blocking:
#   - new runtime dependencies on the allow-list (FIRST_PARTY in publish-gate.mjs,
#     extended by `allowed-new-dependencies`)
#   - removed dependencies and any other change to the tarball file list
#
# The script ships inside this action, so it is versioned by the same tag as the
# workflow that calls it. The cyberuni copy checks its script out from `main`,
# which lets an unreleased change reach every consumer.
inputs:
  allowed-new-dependencies:
    description: >-
      Extra package names or `@scope/*` patterns whose addition as a runtime
      dependency is reported but not blocked. Newline- or comma-separated.
      Extends the built-in first-party list; never replaces it.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Gate
      shell: bash
      run: node "$GITHUB_ACTION_PATH/cli.mjs"
      env:
        PUBLISH_GATE_ALLOWED_DEPENDENCIES: ${{ inputs.allowed-new-dependencies }}

    # The report is the point of the step, so keep it even when the gate blocks.
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: publish-gate-report
        path: publish-gate-report.md
        if-no-files-found: ignore
