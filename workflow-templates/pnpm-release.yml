name: release
on:
  push:
    branches: [$default-branch]

permissions: {}

jobs:
  # Register this file (release.yml) as the trusted publisher of every package
  # at npmjs.com/package/<name>/access before the first release.
  release:
    uses: spikyuni/.github/.github/workflows/pnpm-release.yml@v1
    permissions:
      contents: write
      pull-requests: write
      id-token: write
